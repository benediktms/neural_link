services:
  neural_link:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: neural_link:latest
    container_name: neural_link
    restart: unless-stopped
    ports:
      # Bind to localhost only by default — expose via reverse proxy or
      # Tailscale Funnel when remote access is desired.
      - "127.0.0.1:9961:9961"
    environment:
      NEURAL_LINK_PORT: "9961"
      NEURAL_LINK_TRANSPORT: "http"
      NEURAL_LINK_DATA_DIR: "/data"
      # Set NEURAL_LINK_AUTH_TOKEN to enforce bearer-token auth on every
      # request except /health and /ready. Leave empty for LAN-only deployments
      # behind a private network (e.g. Tailscale).
      NEURAL_LINK_AUTH_TOKEN: "${NEURAL_LINK_AUTH_TOKEN:-}"
    volumes:
      - neural_link_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9961/ready"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  neural_link_data:
    driver: local
